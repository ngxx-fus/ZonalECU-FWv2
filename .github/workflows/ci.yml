name: ZonalECU-FWv2 CI/CD

on:
  push:
    branches:
      - ZE-Master
      - FWv2-Master
      - main
      - master
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  job0_git_conventions:
    name: "Job 0: Conventions & Formatting"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install clang-format
        run: |
          if ! command -v clang-format &> /dev/null; then
            echo "clang-format not found. Installing..."
            sudo apt-get update -o Acquire::Retries=3 || true
            sudo apt-get install -y --no-install-recommends clang-format
          else
            echo "clang-format is already available: $(clang-format --version)"
          fi

      - name: Run Code Formatting Check
        run: |
          chmod +x .github/scripts/*.sh .github/scripts/*.py
          ./.github/scripts/check_formatting.sh

      - name: Run Git Conventions Check
        continue-on-error: true
        run: |
          ./.github/scripts/check_git_conventions.sh

  job1_clangd_analysis:
    name: "Job 1: Clangd Static Analysis"
    runs-on: ubuntu-latest
    needs: [job0_git_conventions]
    if: always()
    container:
      image: espressif/idf:release-v6.1

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install clangd
        run: |
          if ! command -v clangd &> /dev/null; then
            echo "clangd not found. Installing..."
            SUDO=""
            if command -v sudo &> /dev/null; then SUDO="sudo"; fi
            $SUDO apt-get update -o Acquire::Retries=3 || true
            $SUDO apt-get install -y --no-install-recommends clangd
          else
            echo "clangd is already available: $(clangd --version)"
          fi

      - name: Generate compilation database for FW-ESP
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          . $IDF_PATH/export.sh
          idf.py -C FW-ESP reconfigure

      - name: Run Clangd Static Analysis
        run: |
          chmod +x .github/scripts/*.sh .github/scripts/*.py
          ./.github/scripts/static_analysis.sh

  job2_compile_fw_stm:
    name: "Job 2: FW-STM Build"
    runs-on: ubuntu-latest
    needs: [job1_clangd_analysis]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: STM32F103 Build Placeholder
        run: |
          echo "=================================================="
          echo " STM32F103C8T6 Firmware Build Placeholder"
          echo " Target Directory : FW-STM"
          echo " Target Toolchain : arm-none-eabi-gcc / CMake"
          echo " Status           : Dummy build passed (placeholder)"
          echo "=================================================="

  job3_compile_fw_esp:
    name: "Job 3: FW-ESP Build"
    runs-on: ubuntu-latest
    needs: [job2_compile_fw_stm]
    container:
      image: espressif/idf:release-v6.1

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build ESP32 firmware with idf.py
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          . $IDF_PATH/export.sh
          chmod +x .github/scripts/build_firmware_esp.sh
          ./.github/scripts/build_firmware_esp.sh

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: esp32-firmware-binaries
          retention-days: 3
          path: |
            FW-ESP/build/ZonalECU-FWv2.bin
            FW-ESP/build/bootloader/bootloader.bin
            FW-ESP/build/partition_table/partition-table.bin
            FW-ESP/build/flasher_args.json

  job4_generate_doxygen:
    name: "Job 4: Project Doxygen Docs"
    runs-on: ubuntu-latest
    needs: [job3_compile_fw_esp]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Doxygen & Graphviz
        run: |
          PACKAGES_TO_INSTALL=""
          if ! command -v doxygen &> /dev/null; then
            PACKAGES_TO_INSTALL="$PACKAGES_TO_INSTALL doxygen"
          else
            echo "doxygen is already available: $(doxygen --version)"
          fi
          if ! command -v dot &> /dev/null; then
            PACKAGES_TO_INSTALL="$PACKAGES_TO_INSTALL graphviz"
          else
            echo "graphviz (dot) is already available: $(dot -V 2>&1)"
          fi
          if [ -n "$PACKAGES_TO_INSTALL" ]; then
            echo "Installing missing package(s):$PACKAGES_TO_INSTALL..."
            sudo apt-get update -o Acquire::Retries=3 || true
            sudo apt-get install -y --no-install-recommends $PACKAGES_TO_INSTALL
          fi

      - name: Run Doxygen (FW-ESP & FW-STM)
        run: |
          chmod +x .github/scripts/build_docs.sh
          ./.github/scripts/build_docs.sh

      - name: Upload Doxygen HTML Artifact
        uses: actions/upload-artifact@v4
        with:
          name: doxygen-documentation
          retention-days: 3
          path: FW-Common/doc/doxygen_html/

      - name: Setup GitHub Pages
        if: github.event_name == 'push' && (github.ref == 'refs/heads/ZE-Master' || github.ref == 'refs/heads/FWv2-Master' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: github.event_name == 'push' && (github.ref == 'refs/heads/ZE-Master' || github.ref == 'refs/heads/FWv2-Master' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: actions/upload-pages-artifact@v3
        with:
          path: FW-Common/doc/doxygen_html/

  job5_deploy_pages:
    name: "Job 5: Deploy to GitHub Pages"
    runs-on: ubuntu-latest
    needs: [job4_generate_doxygen]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/ZE-Master' || github.ref == 'refs/heads/FWv2-Master' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
